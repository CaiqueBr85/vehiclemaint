{% extends "base.html" %}
{% block title %}{% if vehicle %}Editar{% else %}Novo{% endif %} Veículo · VehicleMaint{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-5">
        <div class="d-flex align-items-center gap-2 mb-4">
            <a href="{{ url_for('vehicles.index') }}" class="btn btn-sm" style="border:1px solid var(--vm-border);color:var(--vm-text)"><i class="bi bi-arrow-left"></i></a>
            <h1 class="h5 fw-bold mb-0">{% if vehicle %}Editar Veículo{% else %}Novo Veículo{% endif %}</h1>
        </div>
        <div class="card p-4">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-6">
                        <label class="form-label small text-muted">MARCA</label>
                        <input type="text" name="marca" class="form-control" placeholder="Honda" value="{{ vehicle.marca if vehicle else '' }}" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small text-muted">MODELO</label>
                        <input type="text" name="modelo" class="form-control" placeholder="CB500F" value="{{ vehicle.modelo if vehicle else '' }}" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small text-muted">ANO</label>
                        <input type="number" name="ano" class="form-control" placeholder="2021" value="{{ vehicle.ano if vehicle else '' }}" min="1900" max="2099">
                    </div>
                    <div class="col-6">
                        <label class="form-label small text-muted">MATRÍCULA</label>
                        <input type="text" name="matricula" class="form-control" placeholder="AA-00-BB" value="{{ vehicle.matricula if vehicle else '' }}">
                    </div>
                    <div class="col-12">
                        <label class="form-label small text-muted">COMBUSTÍVEL</label>
                        <select name="combustivel" class="form-select">
                            <option value="">— Selecionar —</option>
                            {% for opt in ['Gasolina', 'Gasóleo', 'Elétrico', 'Híbrido', 'GPL'] %}
                            <option value="{{ opt }}" {% if vehicle and vehicle.combustivel == opt %}selected{% endif %}>{{ opt }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12 mt-2">
                        <button type="submit" class="btn btn-primary w-100">
                            {% if vehicle %}Guardar alterações{% else %}Adicionar veículo{% endif %}
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
